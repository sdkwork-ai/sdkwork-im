[package]
name = "sdkwork-im-pc"
version = "0.1.0"
edition = "2021"
rust-version.workspace = true


[lints]
workspace = true
[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10.3"
base64 = "0.22.1"
chrono = { version = "0.4.41", default-features = false, features = ["clock", "std"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
rqrr = "0.10.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
rusqlite = { version = "0.32.1", features = ["bundled"] }
tauri = { version = "~2.11.0", features = ["tray-icon"] }
tauri-plugin-notification = "2.3.3"
tauri-plugin-shell = "2"
keyring = "2"
open = "5"
url = "2.5.4"

[lib]
name = "sdkwork_chat_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]


[workspace.package]
edition = "2021"
rust-version = "1.85"
[workspace.lints.rust]
# RUST_CODE_SPEC.md section 13 baseline.
# Deny-tier lints (unsafe_code, panic, unwrap_used, expect_used, pedantic) are
# promoted per crate together with their cleanup: enabling them fleet-wide
# today floods or fails builds that have not paid that debt yet.
unsafe_op_in_unsafe_fn = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"
exit = "warn"
