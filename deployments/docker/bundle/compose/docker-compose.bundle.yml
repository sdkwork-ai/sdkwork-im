# SDKWork IM — unified install-image bundle composition.
#
# One image, any environment, N instances per environment (DEPLOYMENT_SPEC.md
# §6 / OPERATIONS_SPEC.md). This file is environment-neutral: deploy.sh
# supplies SDKWORK_IM_ENVIRONMENT, the per-instance management port,
# the image tag, and the shared network and volumes named below (created once
# per environment).
#
# Layout:
#   deps project:     docker compose -p sdkwork-im-<env>-deps \
#                       --env-file env/<env>.env --profile deps up -d
#   instance project: docker compose -p sdkwork-im-<env>-i<i> \
#                       --env-file env/<env>.env --profile instance up -d
#
# Values marked `:?required` MUST come from the --env-file or process env.

# Bounded json-file log rotation: unbounded container logs eventually fill
# the host disk on long-lived deployments (OPERATIONS_SPEC.md §2.3).
x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "3"

x-im-gateway-common: &im-gateway-common
  image: registry.sdkwork.com/apps/sdkwork-im:${SDKWORK_IM_IMAGE_TAG:-0.4.0}
  restart: unless-stopped
  logging: *default-logging
  security_opt:
    - no-new-privileges:true
  # Resource governance (OPERATIONS_SPEC.md §6 runtime hardening).
  deploy:
    resources:
      limits:
        cpus: "${SDKWORK_IM_CPU_LIMIT:-4.0}"
        memory: ${SDKWORK_IM_MEMORY_LIMIT:-4g}
        pids: 512
      reservations:
        cpus: "0.5"
        memory: 512m
  ulimits:
    nofile:
      soft: 65536
      hard: 65536
  extra_hosts:
    - "host.docker.internal:host-gateway"
  networks:
    - sdkwork
  environment:
    SDKWORK_IM_APPLICATION_PUBLIC_INGRESS_BIND: 0.0.0.0:18079
    SDKWORK_IM_RUNTIME_TARGET: container
    SDKWORK_IM_DEPLOYMENT_PROFILE: standalone
    SDKWORK_IM_ENVIRONMENT: ${SDKWORK_IM_ENVIRONMENT:?required}
    SDKWORK_IM_PROFILE_ID: ${SDKWORK_IM_PROFILE_ID:-standalone.${SDKWORK_IM_ENVIRONMENT}}
    # Unique per instance (deploy.sh sets standalone-<env>-i<index>).
    SDKWORK_IM_NODE_UUID: ${SDKWORK_IM_NODE_UUID:-}
    # Snowflake node id for ID generation (id_generator.rs). deploy.sh
    # fail-closed validates it; without it every instance falls back to
    # node 0 and IDs collide across replicas.
    SDKWORK_IM_ID_NODE_ID: ${SDKWORK_IM_ID_NODE_ID:-0}
    # CORS allow-list consumed by the standalone gateway (main.rs).
    SDKWORK_CORS_ALLOWED_ORIGINS: ${SDKWORK_CORS_ALLOWED_ORIGINS:-}
    # Database + Redis (per-environment values from the env file).
    SDKWORK_DATABASE_ENGINE: postgresql
    SDKWORK_DATABASE_HOST: ${SDKWORK_DATABASE_HOST:-postgres}
    SDKWORK_DATABASE_PORT: ${SDKWORK_DATABASE_PORT:-5432}
    SDKWORK_DATABASE_NAME: ${SDKWORK_DATABASE_NAME:-sdkwork_ai_dev}
    SDKWORK_DATABASE_SCHEMA: ${SDKWORK_DATABASE_SCHEMA:-${SDKWORK_DATABASE_NAME:-sdkwork_ai_dev}}
    SDKWORK_DATABASE_USERNAME: ${SDKWORK_DATABASE_USERNAME:-sdkwork_ai_dev}
    SDKWORK_DATABASE_PASSWORD: ${SDKWORK_DATABASE_PASSWORD:-}
    SDKWORK_DATABASE_SSL_MODE: ${SDKWORK_DATABASE_SSL_MODE:-disable}
    SDKWORK_DATABASE_MAX_CONNECTIONS: ${SDKWORK_DATABASE_MAX_CONNECTIONS:-10}
    SDKWORK_IM_REDIS_HOST: ${SDKWORK_IM_REDIS_HOST:-redis}
    SDKWORK_IM_REDIS_PORT: ${SDKWORK_IM_REDIS_PORT:-6379}
    SDKWORK_IM_REDIS_DATABASE: ${SDKWORK_IM_REDIS_DATABASE:-0}
    SDKWORK_IM_REDIS_PASSWORD: ${SDKWORK_IM_REDIS_PASSWORD:-}
    RUST_LOG: ${RUST_LOG:-info}
  volumes:
    - im-secrets:/etc/sdkwork/im/secrets
    - im-data:/var/lib/sdkwork/im
  healthcheck:
    test:
      [
        "CMD-SHELL",
        "curl -fsS http://127.0.0.1:18079/healthz || exit 1",
      ]
    interval: 15s
    timeout: 5s
    retries: 8
    start_period: 60s

services:
  # Embedded dependencies (opt in with --embedded). The default is external:
  # supply SDKWORK_DATABASE_HOST / SDKWORK_IM_REDIS_HOST via the
  # env file.
  postgres:
    image: pgvector/pgvector:pg16
    profiles: [deps]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "${PG_CPU_LIMIT:-2.0}"
          memory: ${PG_MEMORY_LIMIT:-2g}
          pids: 256
        reservations:
          cpus: "0.5"
          memory: 512m
    command: ["postgres", "-c", "max_connections=${PG_MAX_CONNECTIONS:-200}"]
    networks:
      - sdkwork
    environment:
      POSTGRES_USER: ${IM_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${IM_POSTGRES_PASSWORD:?IM_POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${IM_POSTGRES_DB:-postgres}
    volumes:
      - im-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${IM_POSTGRES_USER:-postgres} -d ${IM_POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8-alpine
    profiles: [deps]
    restart: unless-stopped
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-768mb}
      - --maxmemory-policy
      - ${REDIS_MAXMEMORY_POLICY:-allkeys-lru}
    deploy:
      resources:
        limits:
          cpus: "${REDIS_CPU_LIMIT:-1.0}"
          memory: ${REDIS_MEMORY_LIMIT:-1g}
          pids: 128
        reservations:
          cpus: "0.25"
          memory: 128m
    networks:
      - sdkwork
    volumes:
      - im-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  # One gateway instance. deploy.sh runs each instance as its own compose
  # project so N instances coexist without fixed container_name collisions.
  im-gateway:
    <<: *im-gateway-common
    profiles: [instance]
    ports:
      - "${SDKWORK_IM_MGMT_HOST_PORT:?required}:18079"
    logging: *default-logging

networks:
  sdkwork:
    name: sdkwork-im-${SDKWORK_IM_ENVIRONMENT:?required}
    external: true

volumes:
  im-secrets:
    name: sdkwork-im-${SDKWORK_IM_ENVIRONMENT:?required}-secrets
    external: true
  im-data:
    name: sdkwork-im-${SDKWORK_IM_ENVIRONMENT:?required}-data
    external: true
  im-postgres-data:
    name: sdkwork-im-${SDKWORK_IM_ENVIRONMENT:?required}-postgres-data
    external: true
  im-redis-data:
    name: sdkwork-im-${SDKWORK_IM_ENVIRONMENT:?required}-redis-data
    external: true
