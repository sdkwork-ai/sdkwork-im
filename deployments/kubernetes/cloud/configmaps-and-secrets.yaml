# Secret template for shared database and Redis credentials.
# Replace placeholder values with actual credentials before applying.
# Use `kubectl create secret generic sdkwork-im-shared-secrets --from-literal=...` for production.
apiVersion: v1
kind: Secret
metadata:
  name: sdkwork-im-shared-secrets
  namespace: sdkwork-im
  labels:
    app.kubernetes.io/part-of: sdkwork-im
type: Opaque
stringData:
  # PostgreSQL connection URL (replace host, port, db, user, password).
  # Unified workspace identity (ENVIRONMENT_SPEC section 7.1): sdkwork_ai_prod.
  SDKWORK_DATABASE_URL: postgresql://sdkwork_ai_prod:<REPLACE_WITH_ACTUAL_VALUE>@postgres.database.svc:5432/sdkwork_ai_prod?sslmode=require
  # Redis connection URL consumed by IM readiness, rate limiting, route store,
  # realtime cluster bus, and reuse caches (exact runtime env name).
  SDKWORK_IM_REDIS_URL: redis://:<REPLACE_WITH_ACTUAL_VALUE>@redis.cache.svc:6379/0
  # Shared JWT replay protection across replicas (required when the replay TTL
  # is enabled; production fails closed otherwise).
  SDKWORK_IM_JWT_REPLAY_REDIS_URL: redis://:<REPLACE_WITH_ACTUAL_VALUE>@redis.cache.svc:6379/0
  # Realtime cross-node cluster bus (session-gateway HA). Setting the URL also
  # enables cluster mode, which requires the secret and a non-default node id.
  SDKWORK_IM_REALTIME_CLUSTER_BUS_URL: redis://:<REPLACE_WITH_ACTUAL_VALUE>@redis.cache.svc:6379/0
  SDKWORK_IM_REALTIME_CLUSTER_BUS_SECRET: <REPLACE_WITH_ACTUAL_VALUE_32_BYTES>
  # App-context header signature secret used to verify trusted gateway context.
  # Production readiness requires at least 32 characters and rejects dev fallbacks.
  SDKWORK_IM_APP_CONTEXT_SIGNATURE_SECRET: <REPLACE_WITH_ACTUAL_VALUE_32_BYTES>
  # JWT signing secret for session tokens (exact runtime env name).
  # Production readiness requires at least 32 characters.
  SDKWORK_IM_APP_CONTEXT_JWT_SIGNING_SECRET: <REPLACE_WITH_ACTUAL_VALUE_32_BYTES>
  # Object storage (S3) credentials for media service.
  S3_ACCESS_KEY_ID: <REPLACE_WITH_ACTUAL_VALUE>
  S3_SECRET_ACCESS_KEY: <REPLACE_WITH_ACTUAL_VALUE>
  S3_BUCKET_NAME: sdkwork-im-media
  S3_REGION: us-east-1
  S3_ENDPOINT: https://s3.us-east-1.amazonaws.com
  # Push notification service credentials.
  FCM_SERVER_KEY: <REPLACE_WITH_ACTUAL_VALUE>
  APNS_TEAM_ID: <REPLACE_WITH_ACTUAL_VALUE>
  APNS_KEY_ID: <REPLACE_WITH_ACTUAL_VALUE>
  APNS_PRIVATE_KEY: <REPLACE_WITH_ACTUAL_VALUE>
